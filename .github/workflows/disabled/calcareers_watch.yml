name: CalCareers Watcher

on:
  # Daily — CalCareers postings change at day resolution and the portal is slow,
  # so once per day is plenty. Runs at 16:07 UTC (~9am PT) plus on demand.
  schedule:
    - cron: "7 16 * * *"
  workflow_dispatch:

concurrency:
  group: job-scraper-commit-push
  cancel-in-progress: false

jobs:
  scrape:
    name: CalCareers scrape
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write config.json and scoring_profile.json from secrets
        # Only when set: an empty secret must not overwrite a committed file.
        run: |
          if [ -n "$CONFIG_JSON" ]; then echo "$CONFIG_JSON" > config.json; fi
          if [ -n "$SCORING_PROFILE_JSON" ]; then echo "$SCORING_PROFILE_JSON" > scoring_profile.json; fi
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
          SCORING_PROFILE_JSON: ${{ secrets.SCORING_PROFILE_JSON }}

      - name: Scrape CalCareers (California state jobs)
        run: python scrape_jobs.py --calcareers-only
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          NOTIFY_MIN_FIT: ${{ vars.NOTIFY_MIN_FIT }}

      - name: Commit results to repo
        if: vars.ENABLE_DATA_COMMITS == 'true'
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add -f output/calcareers_jobs.json output/calcareers_jobs.md output/calcareers_jobs.html output/all_jobs.json output/dashboard_config.json output/notified.json
          git diff --cached --quiet || git commit -m "chore: update calcareers listings [$(date -u '+%Y-%m-%d %H:%MZ')]"
          git pull --rebase -X ours origin main
          git push
