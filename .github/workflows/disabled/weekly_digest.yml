name: Weekly Job Digest

on:
  schedule:
    # Monday morning after the nightly triage run has had a chance to score jobs.
    - cron: "30 16 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: false
        default: "7"
      force_send:
        description: "Bypass WEEKLY_DIGEST_PUSHOVER for this manual run"
        required: false
        type: boolean
        default: false

env:
  # Branch that holds this repo's job data (repository variable; default
  # main). The maintainer's repo uses a separate branch so forks start empty.
  DATA_BRANCH: ${{ vars.DATA_BRANCH || 'main' }}
  ENABLE_DATA_COMMITS: ${{ vars.ENABLE_DATA_COMMITS }}

jobs:
  digest:
    name: Send weekly Pushover brief
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check out the latest job data
        # actions/checkout captures the commit at trigger time; another workflow
        # may have committed since. Puts us on DATA_BRANCH (default main).
        run: bash scripts/use-data-branch.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write config.json and scoring_profile.json from secrets
        # Only when set: an empty secret must not overwrite a committed file.
        run: |
          if [ -n "$CONFIG_JSON" ]; then echo "$CONFIG_JSON" > config.json; fi
          if [ -n "$SCORING_PROFILE_JSON" ]; then echo "$SCORING_PROFILE_JSON" > scoring_profile.json; fi
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
          SCORING_PROFILE_JSON: ${{ secrets.SCORING_PROFILE_JSON }}

      - name: Send weekly digest
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          WEEKLY_DIGEST_PUSHOVER: ${{ vars.WEEKLY_DIGEST_PUSHOVER }}
          WEEKLY_DIGEST_DAYS: ${{ vars.WEEKLY_DIGEST_DAYS }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: |
          args=(--weekly-digest)
          if [ -n "${{ github.event.inputs.days }}" ]; then
            args+=(--days "${{ github.event.inputs.days }}")
          fi
          if [ "${{ github.event.inputs.force_send }}" = "true" ]; then
            args+=(--force)
          fi
          python notify.py "${args[@]}"
