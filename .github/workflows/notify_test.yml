name: Test Pushover Notification

# Manually trigger from the Actions tab to send a single test push to your
# phone — confirms PUSHOVER_TOKEN / PUSHOVER_USER are set correctly on GitHub.
on:
  workflow_dispatch:

jobs:
  test:
    name: Send test push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write config.json and scoring_profile.json from secrets
        # Only when set: an empty secret must not overwrite a committed file.
        run: |
          if [ -n "$CONFIG_JSON" ]; then echo "$CONFIG_JSON" > config.json; fi
          if [ -n "$SCORING_PROFILE_JSON" ]; then echo "$SCORING_PROFILE_JSON" > scoring_profile.json; fi
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
          SCORING_PROFILE_JSON: ${{ secrets.SCORING_PROFILE_JSON }}

      - name: Send test Pushover notification
        run: python notify.py --test
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
