name: Tests

on:
  # Every change except data commits, which only touch output/ (hourly).
  push:
    paths-ignore:
      - "output/**"
  pull_request:
    paths-ignore:
      - "output/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-dev.txt
      - name: Run tests
        run: pytest tests/ -v --ignore=tests/local
