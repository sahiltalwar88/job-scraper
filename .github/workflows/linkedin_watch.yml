name: LinkedIn Watcher

on:
  # Native GitHub cron, hourly at :17 during the active window (5am–8pm PT ≈
  # 12:00–03:00 UTC; 5am PT covers 8am ET). GH's scheduler occasionally skips a
  # slot, so the watchdog (linkedin_watch_backup.yml at :33) re-dispatches as
  # backup. For higher reliability you can also drive this externally via
  # cron-job.org → the workflow_dispatch API; both triggers are safe to run
  # together (dedupe + the commit-push concurrency group prevent collisions).
  schedule:
    - cron: "17 12-23,0-3 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Legacy single-run backfill (last 7 days). For large backfills, use the 'LinkedIn Backfill (Parallel)' workflow instead."
        required: false
        type: boolean
        default: false

concurrency:
  group: job-scraper-commit-push
  cancel-in-progress: false

env:
  # Branch that holds this repo's job data (repository variable; default
  # main). The maintainer's repo uses a separate branch so forks start empty.
  DATA_BRANCH: ${{ vars.DATA_BRANCH || 'main' }}
  ENABLE_DATA_COMMITS: ${{ vars.ENABLE_DATA_COMMITS }}

jobs:
  scrape:
    name: LinkedIn scrape
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check out the latest job data
        # actions/checkout captures the commit at trigger time; another workflow
        # may have committed since. Puts us on DATA_BRANCH (default main).
        run: bash scripts/use-data-branch.sh

      - name: Write config.json and scoring_profile.json from secrets
        # Only when set: an empty secret must not overwrite a committed file.
        run: |
          if [ -n "$CONFIG_JSON" ]; then echo "$CONFIG_JSON" > config.json; fi
          if [ -n "$SCORING_PROFILE_JSON" ]; then echo "$SCORING_PROFILE_JSON" > scoring_profile.json; fi
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
          SCORING_PROFILE_JSON: ${{ secrets.SCORING_PROFILE_JSON }}

      - name: Scrape LinkedIn (last 1h, or 7-day backfill)
        run: |
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            python scrape_jobs.py --linkedin-backfill
          else
            python scrape_jobs.py --linkedin-only
          fi
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          NOTIFY_MIN_FIT: ${{ vars.NOTIFY_MIN_FIT }}

      - name: Record workflow run
        run: |
          python - <<'EOF'
          import json
          import os
          from datetime import datetime, timezone

          with open("output/linkedin_jobs.json", encoding="utf-8") as f:
              data = json.load(f)

          entry = {
              "workflow": "linkedin",
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "job_count": int(data.get("total", 0)),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
          }

          with open("output/workflow_runs.jsonl", "a", encoding="utf-8") as f:
              f.write(json.dumps(entry, sort_keys=True) + "\n")
          EOF

      - name: Commit results to repo
        if: vars.ENABLE_DATA_COMMITS == 'true'
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          bash scripts/add-output.sh output/linkedin_jobs.json output/linkedin_jobs.md output/linkedin_jobs.html output/workflow_runs.jsonl output/all_jobs.json output/dashboard_config.json output/notified.json
          # output/deltas/ only exists once a run has written a delta; a
          # missing pathspec would make git add (and this step) fail.
          if [ -d output/deltas ]; then git add -f output/deltas/; fi
          git diff --cached --quiet || git commit -m "chore: update linkedin listings [$(date -u '+%Y-%m-%d %H:%MZ')]"
          git pull --rebase -X theirs origin "$DATA_BRANCH"
          git push origin "HEAD:$DATA_BRANCH"
