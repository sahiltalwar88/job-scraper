name: LinkedIn Backfill (Parallel)

# Partitioned backfill: emit-matrix job generates a work matrix (4 term-batches
# × 52 locations = 208 workers), fan-out runs each partition in parallel on its
# own runner, merge downloads all artifacts, deduplicates, and commits once.
#
# Each worker paginates 2 terms for one location (up to 1000 cards each),
# location-filters, enriches, and writes a per-partition JSON artifact.
# The merge job collects all artifacts, deduplicates by URL/job ID, and merges
# into linkedin_jobs.json + all_jobs.json.
#
# Trigger manually via Actions → "LinkedIn Backfill (Parallel)" → Run workflow.
on:
  workflow_dispatch:

jobs:
  emit-matrix:
    name: Emit matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.emit.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write config.json from secret
        run: echo "$CONFIG_JSON" > config.json
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}

      - name: Emit work matrix
        id: emit
        run: python scrape_jobs.py --linkedin-emit-matrix

      - name: Upload matrix (debugging)
        uses: actions/upload-artifact@v4
        with:
          name: discovery-matrix
          path: output/linkedin_matrix.json
          retention-days: 1

  fanout:
    name: Scrape "${{ matrix.partition.partition_key }}"
    needs: emit-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: ${{ fromJson(needs.emit-matrix.outputs.matrix) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write config.json from secret
        run: echo "$CONFIG_JSON" > config.json
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}

      - name: Write partition spec
        run: echo '${{ toJSON(matrix.partition) }}' > output/partition_spec.json

      - name: Scrape partition
        run: python scrape_jobs.py --linkedin-backfill-partition output/partition_spec.json
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          NOTIFY_MIN_FIT: ${{ vars.NOTIFY_MIN_FIT }}

      - name: Upload partition results
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-partition-${{ matrix.partition.partition_key }}
          path: output/linkedin_partition_*.json
          retention-days: 1

  merge:
    name: Merge + commit
    needs: fanout
    runs-on: ubuntu-latest

    concurrency:
      group: job-scraper-commit-push
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write config.json from secret
        run: echo "$CONFIG_JSON" > config.json
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: linkedin-partition-*
          merge-multiple: true
          path: output/

      - name: Merge partition results
        run: python scrape_jobs.py --linkedin-merge-backfill
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}

      - name: Record workflow run
        run: |
          python - <<'EOF'
          import json
          import os
          from datetime import datetime, timezone

          with open("output/linkedin_jobs.json", encoding="utf-8") as f:
              data = json.load(f)

          entry = {
              "workflow": "linkedin-backfill-partitioned",
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "job_count": int(data.get("total", 0)),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
          }

          with open("output/workflow_runs.jsonl", "a", encoding="utf-8") as f:
              f.write(json.dumps(entry, sort_keys=True) + "\n")
          EOF

      - name: Commit results to repo
        if: vars.ENABLE_DATA_COMMITS == 'true'
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add -f output/linkedin_jobs.json output/linkedin_jobs.md output/linkedin_jobs.html output/workflow_runs.jsonl output/all_jobs.json output/notified.json
          git diff --cached --quiet || git commit -m "chore: linkedin backfill (partitioned) [$(date -u '+%Y-%m-%d %H:%MZ')]"
          git pull --rebase -X ours origin main
          git push
